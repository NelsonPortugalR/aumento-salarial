# Recalcula las bandas cada mes y abre un PR para revisión humana. No publica nada por sí solo.
name: Actualizar datos salariales
on:
  schedule:
    - cron: '17 13 3 * *'   # día 3 de cada mes (después del IPC del INEI, que sale el día 1)
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: data/raw/enaho
          key: enaho-${{ hashFiles('data/pipeline/00_download.sh') }}
      - run: pip install -r data/requirements.txt && npm ci
      - run: npm run data
      - run: npm test && python3 data/pipeline/test_responses.py
      - run: python3 data/pipeline/06_freshness.py > "$RUNNER_TEMP/resumen.md"
      - name: Abrir PR si cambió algo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then echo "Sin cambios"; cat "$RUNNER_TEMP/resumen.md"; exit 0; fi
          rama="datos/$(date +%Y-%m)"
          git config user.name "actualizacion-datos"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B "$rama"
          git add -A
          git commit -m "Actualización mensual de datos salariales $(date +%Y-%m)"
          git push -f origin "$rama"
          gh pr create --base "${{ github.event.repository.default_branch }}" --head "$rama" \
            --title "Datos salariales $(date +%Y-%m)" --body-file "$RUNNER_TEMP/resumen.md" || \
          gh pr edit "$rama" --body-file "$RUNNER_TEMP/resumen.md"
