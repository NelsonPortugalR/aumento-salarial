}

.row-actions{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:10px}

.tools{display:flex;gap:8px;flex-wrap:wrap}
.speech{margin:10px 0 0;padding:0;list-style:none;counter-reset:s}
.speech li{position:relative;padding:12px 0 12px 40px;border-bottom:1px dashed var(--rule)}
.speech li:last-child{border-bottom:0}

.obj{padding:14px 0;border-bottom:1px solid var(--rule)}

.plain{margin:10px 0 0;padding-left:1.2em}

.sheet{width:100%;max-width:36rem;max-height:92vh;overflow:auto;background:var(--paper);border-radius:18px 18px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px))}

.code-row input{flex:1;min-width:0;border:1.5px solid var(--rule);border-radius:12px;background:var(--paper);color:var(--ink);font:inherit;padding:12px 14px;text-transform:uppercase}

.owner{border:1.5px dashed var(--rule);border-radius:12px;padding:12px 14px;margin-top:18px}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media print{.top .tag,.kit-tools,.foot,.no-print,#modal-root{display:none!important}body{background:#fff;color:#000}}
</style>

        kit.ladder.push(`Último: ${money(L[3])}, más algo que no es plata: una capacitación pagada, un día de trabajo remoto o una revisión en seis meses.`);
      } else {
        kit.ladder.push(`Último: ${money(L[L.length - 1])}, más algo que no es plata: una capacitación pagada, un día de trabajo remoto o una revisión en seis meses.`);
      }
      kit.ladderRule = 'Cada concesión es más chica que la anterior: así se nota que llegaste a tu límite. Nunca partas la diferencia.';

    // Correo de cierre
    const propuesta = raise
      ? `Mi propuesta: ajuste a ${money(n.anchor)} mensuales.`

    kit.email = [
      'Asunto: Resumen de nuestra conversación',
      '',
      `${jefe ? 'Hola, ' + jefe : 'Hola'}:`,
      '',
      `Gracias por el tiempo de hoy. ${T('Te', 'Le')} escribo para dejar por escrito lo que conversamos:`,

      `- ${propuesta}`,

      '',
      `Quedo pendiente de cualquier información adicional que ${T('necesites', 'necesite')}.`,
      '',
      'Saludos,',
      '[Tu nombre]'
    ].join('\n');

    // Si te dicen que no
    kit.ifNo = [
      `Pregunta: "¿Qué tendría que pasar para llegar a ${raise ? money(n.anchor) : 'ese siguiente nivel'}?" Acuerden dos o tres metas, un plazo y una fecha de revisión.`,

    if (r.pct < 25) kit.ifNo.push(`Si en esa fecha no hay ajuste y sigues bajo la mediana, mira el mercado: tu pretensión afuera debería ir de ${money(n.pretFrom)} a ${money(n.pretTo)}.`);

    kit.dont = [

      'Partir la diferencia: si te ofrecen menos, primero pregunta cómo llegar a tu cifra.',
      'Palabras que te restan: "creo", "siento", "pienso", "solo", "un poquito", "sería justo", "¿podría ser?". Afirma: "propongo", "mis resultados muestran".',
      'Hablar de antigüedad en vez de resultados: el tiempo en el puesto no es un argumento, lo que lograste en ese tiempo sí.'
    ];

    // Si te dicen que sí
    kit.ifYes = [
      'Agradece y para de negociar: no sigas argumentando lo que ya ganaste.',
      'Confirma tres datos: el monto, desde qué mes rige y que se verá en tu boleta.',
      'Ese mismo día, déjalo por escrito con el correo de cierre.',
      `Acuerda cuándo revisarán de nuevo tu desempeño: ${MONTHS[(now.getMonth() + 6) % 12]} es una buena fecha.`
    ];

    // Plan B: tu empleabilidad no depende de una sola reunión
    kit.planB = [
      'Actualiza tu CV y tu perfil de LinkedIn con logros, no con funciones: problema, acción y resultado con número.',
      'Ten dos conversaciones al mes con gente de tu sector: así sabes cuánto se paga afuera y te encuentran cuando hay vacantes.',
      `Tu referencia afuera: una pretensión de ${money(n.pretFrom)} a ${money(n.pretTo)} brutos mensuales.`,
      'Si aparece una oferta por escrito, decídela por lo que ganas en el año y tu crecimiento, no solo por el sueldo mensual.'
    ];
    const off = (typeof MARKET !== 'undefined' && MARKET.offers && MARKET.offers[a.nivel]) || null;
    if (off) kit.planB.push(`En ${off.n} avisos recientes para tu nivel, lo ofrecido equivale a ${Math.round(off.indice * 100)}% de la mediana de mercado: úsalo para saber cuánto se está ofreciendo hoy.`);


    kit.employerCost = raise ? Math.round((n.anchor - Number(a.sueldo)) * CONFIG.employerFactor / 10) * 10 : null;
    kit.sheet = [
      'Mi maletín: resultados y propuesta',
      `Puesto: ${role.label}, ${lowerFirst(level.label)}${tenure ? ', ' + lowerFirst(tenure.label) + ' en el puesto' : ''}.`,
      'Resultados del último año (logro, impacto para la empresa y valor aproximado en soles):',
      `- ${logro1}. Impacto: ${impacto}. Valor: ${clean(k.valor1) || '[S/ aprox.]'}.`,
      `- ${logro2}. Valor: ${clean(k.valor2) || '[S/ aprox.]'}.`,
      '- [Agrega de tres a seis logros más con el mismo formato.]',
      `Responsabilidades nuevas: ${resp.charAt(0).toUpperCase() + resp.slice(1)}.`,
      `Lo que me propongo lograr en los próximos seis meses: ${plan}.`,
      `Referencia de mercado: mi sueldo está ${r.pos === 'bajo' ? 'por debajo de la mediana' : r.pos === 'rango' ? 'dentro del rango' : 'sobre la mediana'} para mi perfil. Mediana estimada: ${money(r.band.p50)} brutos mensuales (encuesta de hogares del INEI 2022-2025 actualizada a 2026 y guías salariales 2026).`,
      raise ? `Propuesta: ${money(n.anchor)} mensuales, desde ${m1}.` : 'Propuesta: proyecto con metas y revisión de sueldo en seis meses.'
    ].join('\n');

    kit.pretension = `Si te llama otra empresa, tu pretensión debería ir de ${money(n.pretFrom)} a ${money(n.pretTo)}: nunca menos de lo que ganas hoy más 10%, porque cambiar de trabajo tiene un costo y un riesgo. Escríbela así: "${money(n.pretFrom)} a ${money(n.pretTo)} brutos mensuales, negociable según el paquete."`;
    kit.days = [d1, d2];
    kit.months = [m1, m2];

  }

  function toText(kit, a) {
    const L = [];
    const n = kit.numbers;
    L.push('PÍDELO BIEN: TU KIT PARA LA REUNIÓN', '');

    if (kit.raise) {
      L.push('TUS NÚMEROS', `Cifra para pedir: ${money(n.anchor)}`, `Objetivo: ${money(n.target)}`, `Piso: ${money(n.floor)}`, `Efecto anual del objetivo: ${money(n.annual)} más al año (régimen general)`);
      if (kit.raiseContext) L.push(kit.raiseContext);
      if (kit.mype) L.push(kit.mype);
      L.push(`Banda de mercado para tu perfil: ${money(n.band.p25)} (P25), ${money(n.band.p50)} (mediana), ${money(n.band.p75)} (P75).`, '');
    } else {
      L.push('QUÉ PEDIR EN VEZ DE SUELDO', ...kit.alternatives.map(x => '- ' + x), '');
    }
    if (kit.prep) L.push('ANTES DE LA REUNIÓN', kit.prep.timing, 'Mensaje: ' + kit.prep.ask, 'Qué decir: ' + kit.prep.script, kit.prep.checkin, kit.prep.log, 'Averigua antes:', ...kit.prep.research.map(x => '- ' + x), '');
    if (kit.package) L.push('AMPLÍA EL PAQUETE', ...kit.package.map(x => '- ' + x), '');
    L.push('MENSAJE PARA PEDIR LA REUNIÓN', kit.whatsapp);
    if (kit.whatsappFollow) L.push(kit.whatsappFollow);
    L.push('', 'TU SPEECH');
    const sp = kit.speech;
    [sp.auditoria, sp.apertura, sp.prueba, sp.plan, sp.mercado, sp.pedido, sp.silencio, sp.cierre].filter(Boolean).forEach((x, i) => L.push(`${i + 1}. ${x}`));
    L.push('');
    if (kit.ladder) L.push('SI TE OFRECEN MENOS', ...kit.ladder.map(x => '- ' + x), kit.ladderRule, '');
    if (kit.tools) {
      L.push('FRASES PARA LA CONVERSACIÓN');
      kit.tools.forEach(t => L.push(`${t.name}: ${t.how}`, ...t.ex.map(x => '   "' + x + '"')));
      L.push(kit.voice, '');
    }
    L.push('LO QUE TE VAN A DECIR Y QUÉ RESPONDER');
    kit.objections.forEach((o, i) => { L.push(`${i + 1}. "${o.q}"`, '   Qué significa: ' + o.means, '   Qué responder: ' + o.reply, '   Qué no hacer: ' + o.avoid); });
    L.push('', 'CORREO DESPUÉS DE LA REUNIÓN', kit.email, '', 'SI TE DICEN QUE NO', ...kit.ifNo.map(x => '- ' + x), '', 'LO QUE NO DEBES DECIR', ...kit.dont.map(x => '- ' + x), '');
    if (kit.ifYes) L.push('SI TE DICEN QUE SÍ', ...kit.ifYes.map(x => '- ' + x), '');
    if (kit.planB) L.push('TU PLAN B', ...kit.planB.map(x => '- ' + x), '');
    L.push('TU MALETÍN', kit.sheet, '');
    if (kit.employerCost) L.push(`Tu propuesta le costaría a la empresa cerca de ${money(kit.employerCost)} al año (régimen general).`, '');
    L.push('SI TE LLAMA OTRA EMPRESA', kit.pretension, '');
    if (kit.legalNote) L.push(kit.legalNote, '');
    L.push('Referencia de mercado, no asesoría legal ni promesa de aumento.');
    return L.join('\n');
  }

  return { build, toText, dayPair, monthPair, money };
})();

const STORE_KEY = 'pidelo-bien-v2';
const FRESH = () => ({ view: 'test', stepId: 'puesto', answers: {}, contribute: false, kitIn: null, kitDraft: null, kit: null, polished: false, sim: null, moreRegions: false, netCalc: null, recordSent: false });
const S = Object.assign(FRESH(), { unlocked: false });
const RT = { sample: null, downloads: null, isOwner: false, busy: false, ctl: null, landed: false, userActed: false, simText: '' };

const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const soles = n => 'S/\u00A0' + Math.round(n).toLocaleString('en-US');
const soles2 = n => 'S/\u00A0' + Number(n).toFixed(2);
const lowerFirstUI = s => s ? s.charAt(0).toLowerCase() + s.slice(1) : s;

function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { /* almacenamiento no disponible */ } }
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d && typeof d === 'object') Object.assign(S, d);
  } catch (e) { /* ignorar */ }
}
function resetTest() {
  const keepUnlock = S.unlocked;
  Object.assign(S, FRESH(), { unlocked: keepUnlock });
  RT.landed = false;
  render();
  window.scrollTo(0, 0);
}

const visibleSteps = () => STEPS.filter(s => !s.when || s.when(S.answers));
const needsField = a => ['mineria', 'construccion', 'agro'].includes(a.sector) || ['ing_minas', 'ing_civil', 'seguridad', 'mantenimiento'].includes(a.puesto);
const salaryOk = () => Number(S.answers.sueldo) >= 500 && Number(S.answers.sueldo) <= 150000;

/* ---------- Render ---------- */
function render() {
  if (S.view === 'result' && !S.answers.sueldo && !Engine.route(S.answers)) S.view = 'test';
  if ((S.view === 'interview' || S.view === 'kit') && !S.unlocked) S.view = 'result';
  let html;
  if (S.view === 'exit') html = viewExit();
  else if (S.view === 'result') html = viewResult();
  else if (S.view === 'interview') html = viewInterview();
  else if (S.view === 'kit') html = viewKit();
  else html = viewTest();
  $('#app').innerHTML = html;
  syncCapabilityUI();
  save();
}

function viewTest() {
  const steps = visibleSteps();
  let idx = steps.findIndex(s => s.id === S.stepId);
  if (idx < 0) { idx = 0; S.stepId = steps[0].id; }
  const step = steps[idx];
  const hero = idx === 0
    ? `<section class="hero"><h1>¿Te sumaron funciones y el sueldo sigue igual?</h1><p class="lede">En 90 segundos sabes si estás bajo el mercado, si es buen momento para pedir y por cuánto.</p></section>`
    : '';
  const bars = steps.map((s, i) => `<span class="${i <= idx ? 'on' : ''}"></span>`).join('');
  const body = step.type === 'salary' ? salaryBlock() : optionsBlock(step);
  const back = idx > 0 ? '<button type="button" class="link" data-action="back">Atrás</button>' : '<span></span>';
  const trust = idx === 0 ? '<p class="fine">Gratis y anónimo. No pedimos nombre, DNI ni empresa.</p>' : '';
  return `${hero}<section class="q" aria-labelledby="q-title">
    <div class="progress" aria-hidden="true">${bars}</div>
    <p class="count">${idx + 1} de ${steps.length}</p>
    <h2 id="q-title" tabindex="-1">${esc(step.title)}</h2>
    ${body}
    <div class="q-foot">${back}</div>
    ${trust}
  </section>`;
}

function optionsBlock(step) {
  const cur = S.answers[step.id];
  const extra = (step.id === 'region' && needsField(S.answers))
    ? `<label class="check"><input type="checkbox" data-field="campo" ${S.answers.campo ? 'checked' : ''}><span>Trabajo en unidad minera, obra o campo</span></label>`
    : '';
  const cls = step.type === 'grid' ? 'opts grid' : 'opts';
  let list = step.options;
  let more = '';
  if (step.id === 'region') {
    const showAll = S.moreRegions || (cur && !(byId(REGIONS, cur) || {}).main);
    if (!showAll) {
      list = REGIONS.filter(o => o.main);
      more = '<button type="button" class="opt" data-action="more-regions">Otra región</button>';
    }
  }
  const opts = list.map(o => `<button type="button" class="opt${cur === o.id ? ' is-on' : ''}" role="radio" aria-checked="${cur === o.id}" data-action="pick" data-step="${step.id}" data-value="${o.id}">${esc(o.label)}</button>`).join('');
  return `${extra}<div class="${cls}" role="radiogroup" aria-labelledby="q-title">${opts}${more}</div>`;
}

function salaryBlock() {
  const v = S.answers.sueldo || '';
  const vv = S.answers.variable || '';
  return `<div class="money"><span class="cur" aria-hidden="true">S/</span><input id="sueldo" data-field="sueldo" inputmode="numeric" autocomplete="off" placeholder="3500" value="${esc(v)}" aria-label="Sueldo bruto mensual en soles"></div>
    <p class="help">Antes de descuentos, sin gratificaciones ni bonos.</p>
    ${netCalcBlock()}
    <label class="small-label" for="variable">¿Recibes comisiones o bonos cada mes? Promedio, opcional</label>
    <div class="money small"><span class="cur" aria-hidden="true">S/</span><input id="variable" data-field="variable" inputmode="numeric" autocomplete="off" placeholder="0" value="${esc(vv)}"></div>
    <p class="fine">Lo sumamos a tu sueldo para compararte: el mercado también incluye comisiones y bonos mensuales.</p>
    <p class="warn" id="sueldo-warn" ${salaryWarning() ? '' : 'hidden'}>${esc(salaryWarning())}</p>
    <button type="button" class="btn" data-action="salary-next" ${salaryOk() ? '' : 'disabled'}>Continuar</button>
    <p class="fine">Tu sueldo se usa solo para calcular tu resultado, en tu navegador. No pedimos nombre, DNI ni empresa. <button type="button" class="link inline" data-action="privacy">Cómo cuidamos tus datos</button></p>`;
}
function salaryWarning() {
  const s = Number(S.answers.sueldo);
  if (!s) return '';
  if (s < CONFIG.rmv) return `Si trabajas jornada completa, el mínimo legal es ${soles(CONFIG.rmv)} desde el 1 de octubre de 2026.`;
  return Engine.salaryCheck(S.answers) || '';
}

// ¿Solo sabes lo que te depositan? Calcula el bruto (régimen general, 2026)
function netCalcBlock() {
  const nc = S.netCalc;
  if (!nc) return '<p><button type="button" class="link inline" data-action="net-open">¿Solo sabes lo que te depositan? Calcula tu bruto</button></p>';

      <label class="small-label" for="neto">Lo que te depositan al mes, sin gratificaciones ni bonos</label>
      <div class="money small"><span class="cur" aria-hidden="true">S/</span><input id="neto" data-field="neto" inputmode="numeric" autocomplete="off" placeholder="2800" value="${esc(nc.net || '')}"></div>
      <div class="chips" role="radiogroup" aria-label="Sistema de pensiones">${chip('afp', 'AFP')}${chip('onp', 'ONP')}</div>
      <p class="fine" id="net-out">${gross ? `Tu sueldo bruto sería cerca de ${soles(gross)}.` : 'Escribe el monto para calcularlo.'} Considera AFP o ONP y la retención de quinta categoría de 2026.</p>
      <button type="button" class="btn-sm" data-action="use-gross" ${gross ? '' : 'disabled'}>Usar este monto</button>
    </div>`;
}

/* ---------- Resultado ---------- */
function gapSentence(g) {
  const lo = g[0], hi = g[1];
  if (lo > 2) return `Estás entre ${lo}% y ${hi}% bajo la mediana de tu perfil.`;
  if (hi < -2) return `Estás entre ${-hi}% y ${-lo}% sobre la mediana de tu perfil.`;
  return 'Estás cerca de la mediana de tu perfil.';
}

function confidenceSentence(b) {

// SHA-256 sin dependencias, por si el navegador no expone crypto.subtle
function sha256Fallback(ascii) {
  const rr = (v, a) => (v >>> a) | (v << (32 - a));
  const bin = unescape(encodeURIComponent(ascii));
  const bytes = [];
  for (let i = 0; i < bin.length; i++) bytes.push(bin.charCodeAt(i));
  const K = [], H = [];
  let primeCounter = 0;
  const isComposite = {};
  for (let c = 2; primeCounter < 64; c++) {
    if (!isComposite[c]) {
      for (let i = 0; i < 313; i += c) isComposite[i] = c;
      H[primeCounter] = (Math.pow(c, 0.5) * 4294967296) | 0;
      K[primeCounter++] = (Math.pow(c, 1 / 3) * 4294967296) | 0;
    }
  }
  const hash = H.slice(0, 8);
  const bitLen = bytes.length * 8;
  bytes.push(0x80);
  while (bytes.length % 64 !== 56) bytes.push(0);
  for (let i = 7; i >= 0; i--) bytes.push(i > 3 ? 0 : (bitLen >>> (i * 8)) & 0xff);
  for (let j = 0; j < bytes.length; j += 64) {
    const w = [];
    for (let i = 0; i < 16; i++) w[i] = (bytes[j + i * 4] << 24) | (bytes[j + i * 4 + 1] << 16) | (bytes[j + i * 4 + 2] << 8) | bytes[j + i * 4 + 3];
    for (let i = 16; i < 64; i++) {
      const s0 = rr(w[i - 15], 7) ^ rr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
      const s1 = rr(w[i - 2], 17) ^ rr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
      w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
    }
    let [a, b, c, d, e, f, g, h] = hash;
    for (let i = 0; i < 64; i++) {
      const t1 = (h + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
      const t2 = ((rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    hash[0] = (hash[0] + a) | 0; hash[1] = (hash[1] + b) | 0; hash[2] = (hash[2] + c) | 0; hash[3] = (hash[3] + d) | 0;
    hash[4] = (hash[4] + e) | 0; hash[5] = (hash[5] + f) | 0; hash[6] = (hash[6] + g) | 0; hash[7] = (hash[7] + h) | 0;
  }
  return hash.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
}
async function sha256Hex(text) {
  if (window.crypto && crypto.subtle && typeof crypto.subtle.digest === 'function' && typeof TextEncoder === 'function') {
    try {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    } catch (e) { /* usar respaldo */ }
  }
  return sha256Fallback(text);
}
async function redeem() {
  const inp = $('#code'), err = $('#code-err');
  const code = (inp.value || '').toUpperCase().replace(/\s+/g, '');
  if (!code) { err.textContent = 'Escribe tu código.'; return; }
  try {
    const h = await sha256Hex(code);
    if (CONFIG.codeHashes.includes(h)) unlock();
    else err.textContent = 'Ese código no es válido. Revisa que esté bien escrito.';
  } catch (e) {
    err.textContent = 'No se pudo validar el código en este navegador.';
  }
}

function copyPayload(key) {
  const k = S.kit;
  if (key === 'share') return shareText();
  if (!k) return '';
  if (key === 'whatsapp') return k.whatsapp + (k.whatsappFollow ? '\n\n' + k.whatsappFollow : '');
  if (key === 'speech') { const s = k.speech; return [s.auditoria, s.apertura, s.prueba, s.plan, s.mercado, s.pedido, s.cierre].filter(Boolean).join('\n\n'); }
  if (key === 'prep' && k.prep) return k.prep.ask + '\n\n' + k.prep.script;
  if (key === 'email') return k.email;
  if (key === 'sheet') return k.sheet;
  if (key === 'all') return Kit.toText(k, S.answers);
  return '';
}
function fallbackCopy(t) {
  const ta = document.createElement('textarea');
  ta.value = t; ta.setAttribute('readonly', '');
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove();
  return ok;
}
async function copyText(t, btn) {
  let ok = false;
  try { await navigator.clipboard.writeText(t); ok = true; } catch (e) { ok = fallbackCopy(t); }
  if (btn) {
    const prev = btn.textContent;
    btn.textContent = ok ? 'Copiado' : 'No se pudo copiar';
    setTimeout(() => { btn.textContent = prev; }, 1600);
  }
}
function shareText() {
  const r = Engine.recommend(S.answers, new Date());
  if (r.route || !r.gap) return 'Hice el test de Pídelo Bien para saber si me toca pedir aumento. ¿Y tú?';
  return `Hice el test de Pídelo Bien: ${lowerFirstUI(gapSentence(r.gap)).replace('de tu perfil', 'de mi puesto')} ¿Y tú?`;
}
async function share(btn) {
  const text = shareText();
  if (navigator.share) {
    try { await navigator.share({ text }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  copyText(text, btn);
}
async function download() {
  if (!RT.downloads || !S.kit) return;
  try {
    await RT.downloads.save({ filename: 'kit-pidelo-bien.txt', data: Kit.toText(S.kit, S.answers) });
  } catch (e) {
    const st = $('#ai-status');
    if (e && e.code === 'declined') return;
    if (st) st.textContent = 'No se pudo descargar aquí. Usa "Copiar todo".';
    if (e && ['unavailable', 'not_granted', 'capability_disabled', 'capability_removed'].includes(e.code)) { RT.downloads = null; syncCapabilityUI(); }
  }
}

/* ---------- Capacidades del visor ---------- */
function syncCapabilityUI() {
  document.querySelectorAll('[data-needs]').forEach(el => {
    const need = el.dataset.needs;
    let show = false;
    if (need === 'sample') show = !!RT.sample && !RT.busy;
    else if (need === 'downloads') show = !!RT.downloads;
    else if (need === 'owner') show = RT.isOwner;
    else if (need === 'no-sample') show = !RT.sample;
    el.hidden = !show;
  });
}
function initRuntime() {
  const c = window.claude;
  if (!c || typeof c.use !== 'function') return;
  c.use('sample').then(s => { RT.sample = s || null; syncCapabilityUI(); if (S.view === 'kit' && !S.sim) refreshSim(); }).catch(() => {});
  c.use('downloads').then(d => { RT.downloads = d || null; syncCapabilityUI(); }).catch(() => {});
  c.use('user').then(u => {
    if (!u) return;
    u.isOwner().then(v => { RT.isOwner = !!v; syncCapabilityUI(); }).catch(() => {});
  }).catch(() => {});
}

/* ---------- Eventos ---------- */
function goStep(delta) {
  const steps = visibleSteps();
  const i = steps.findIndex(s => s.id === S.stepId);
  const j = i + delta;
  if (j < 0) return;
  if (j >= steps.length) { S.view = 'result'; RT.landed = false; render(); window.scrollTo(0, 0); return; }
  S.stepId = steps[j].id;
  render();
  const h = $('#q-title');
  if (h && RT.userActed) h.focus({ preventScroll: true });
  window.scrollTo(0, 0);
}

function onPick(stepId, value) {
  S.answers[stepId] = value;
  if (stepId === 'region') S.moreRegions = false;
  if (stepId === 'contrato' && EXIT_ROUTES.includes(value)) {
    S.view = 'exit';
    render();
    window.scrollTo(0, 0);
    return;
  }
  const opts = document.querySelectorAll(`[data-step="${stepId}"]`);
  opts.forEach(o => { const on = o.dataset.value === value; o.classList.toggle('is-on', on); o.setAttribute('aria-checked', String(on)); });
  setTimeout(() => goStep(1), 160);
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-action]');
  if (!t) return;
  const act = t.dataset.action;
  if (act === 'overlay' && e.target !== t) return;
  RT.userActed = true;
  switch (act) {
    case 'home': window.scrollTo(0, 0); break;
    case 'pick': onPick(t.dataset.step, t.dataset.value); break;
    case 'back': goStep(-1); break;
    case 'salary-next': if (salaryOk()) goStep(1); break;
    case 'privacy': openModal(privacyHTML(), 'priv-title'); break;
    case 'method': openModal(methodHTML(), 'method-title'); break;
    case 'contribute': S.contribute = true; sendRecord(S.answers, Engine.recommend(S.answers, new Date())); render(); break;
    case 'more-regions': S.moreRegions = true; render(); break;
    case 'net-open': S.netCalc = { net: '', system: 'afp' }; render(); { const n = $('#neto'); if (n) n.focus(); } break;
    case 'net-system': if (S.netCalc) { S.netCalc.system = t.dataset.value; render(); } break;
    case 'use-gross': {
      const g = S.netCalc ? Engine.grossFromNet(Number(S.netCalc.net) || 0, S.netCalc.system) : 0;
      if (g) { S.answers.sueldo = String(g); S.netCalc = null; render(); }
      break;
    }
    case 'open-paywall': openModal(paywallHTML(), 'pay-title'); break;
    case 'overlay':
    case 'close-modal': closeModal(); break;
    case 'redeem': redeem(); break;
    case 'owner-unlock': if (RT.isOwner) unlock(); break;
    case 'restart': resetTest(); break;
    case 'fix-contract': S.view = 'test'; S.stepId = 'contrato'; delete S.answers.contrato; render(); window.scrollTo(0, 0); break;
    case 'share': share(t); break;
    case 'go-kit': S.view = S.kit ? 'kit' : 'interview'; render(); window.scrollTo(0, 0); break;
    case 'back-result': S.view = 'result'; render(); window.scrollTo(0, 0); break;
    case 'edit-kit': S.kitDraft = Object.assign({}, S.kitIn || {}); S.view = 'interview'; render(); window.scrollTo(0, 0); break;
    case 'kchip': {
      const d = draft(); d[t.dataset.key] = t.dataset.value;
      t.parentElement.querySelectorAll('.chip').forEach(c => { const on = c === t; c.classList.toggle('is-on', on); c.setAttribute('aria-checked', String(on)); });
      save();
      break;
    }
    case 'build-kit': buildKit(); break;
    case 'copy': copyText(copyPayload(t.dataset.copy), t); break;
    case 'download': download(); break;
    case 'polish': polishKit(); break;
    case 'stop-ai': if (RT.ctl) RT.ctl.abort(); break;
    case 'sim-style': simSetStyle(t.dataset.value); break;
    case 'sim-start': simStart(t.dataset.mode); break;
    case 'sim-send': simSend(); break;
    case 'sim-finish': simFinish(); break;
    case 'sim-reset': S.sim = null; refreshSim(); break;
    default: break;
  }
});

    const ub = document.querySelector('[data-action="use-gross"]');
    if (ub) ub.disabled = !g;
    save();
  } else if (el.dataset.field === 'sueldo' || el.dataset.field === 'variable') {

    draft()[el.dataset.kf] = el.value.slice(0, 400);

function aiErrorCopy(e) {
  const code = e && e.code;
  if (code === 'cancelled') return 'Detenido. Tu kit sigue igual.';
  if (code === 'rate_limited') return 'Demasiadas solicitudes por ahora. Intenta de nuevo en un rato.';
  if (code === 'not_granted' || code === 'sampling_disabled' || code === 'not_declared' || code === 'capability_disabled' || code === 'capability_removed')
    return 'La IA no está disponible en esta vista. Tu kit funciona igual sin ella.';
  if (code === 'session_expired') return 'Tu sesión expiró. Vuelve a iniciar sesión para usar la IA.';
  if (code === 'invalid_json') return 'La respuesta llegó incompleta. Intenta de nuevo.';
  return 'No se pudo completar. Intenta de nuevo.';
}
function aiPermanentFailure(e) {
  return e && ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(e.code);
}

function polishPrompt() {

  const usted = kin.trato === 'usted';
  const style = (byId(BOSS_STYLES, kin.estilo) || {}).desc || 'sin dato';
  const approver = (byId(APPROVERS, kin.aprueba) || {}).label || 'sin dato';
  const r = Engine.recommend(S.answers, new Date());
  const cifras = k.raise
    ? `Cifra a pedir: ${Kit.money(n.anchor)}. Objetivo: ${Kit.money(n.target)}. Piso: ${Kit.money(n.floor)}. En el pedido se dice solo la cifra a pedir.`
    : 'No se pide aumento de base: se pide un proyecto con metas, una capacitación o un bono, y una revisión del sueldo en seis meses.';
  const objs = k.objections.map(o => `- id "${o.id}": "${o.q}" Respuesta actual: ${o.reply}`).join('\n');
  return `Eres un coach de negociación salarial en Perú. Reescribe partes de este kit para que suenen naturales, concretas y personales, en español peruano neutro, con frases cortas que se puedan decir en voz alta.

Perfil del colaborador:
${profileLines()}
Recomendación del motor: ${r.stamp}. Posición frente al mercado: ${r.pos === 'bajo' ? 'por debajo de la mediana' : r.pos === 'rango' ? 'dentro del rango' : 'sobre la mediana'}.
Logro 1: ${kin.logro1 || 'no indicado'}
Logro 2: ${kin.logro2 || 'no indicado'}
Lo que ganó la empresa: ${kin.impacto || 'no indicado'}
Plan para los próximos seis meses: ${kin.plan || 'no indicado'}
Responsabilidades nuevas: ${kin.responsabilidades || 'no indicadas'}
Quién aprueba los aumentos: ${approver}. Estilo del jefe: ${style}.

Reglas obligatorias:
- ${cifras} No cambies ninguna cifra ni inventes otras.
- Dirígete al jefe ${usted ? 'de usted' : 'de tú'} en todos los textos.
- El WhatsApp solo pide una reunión de 20 minutos y ofrece dos opciones: el ${k.days[0]} en la mañana o el ${k.days[1]} en la tarde. No negocia por chat ni menciona cifras.
- Una sola cifra, nunca un rango. Nada de deudas, comparaciones con compañeros, ultimátums ni disculpas.
- Si un logro no fue indicado, deja un espacio entre corchetes para que la persona lo complete.
- El speech completo debe poder decirse en 60 a 90 segundos. Sigue esta lógica: entusiasmo por la empresa y aporte, resultados con números, un plan de lo que viene, dato de mercado, una cifra concreta y cierre con fecha.
- El pedido se presenta como propuesta de valor para la empresa, no como necesidad personal.
- El speech abre adelantándose a las dudas del jefe ("quizá pienses que…") antes de hablar del aporte.
- En las objeciones, empieza con una etiqueta ("parece que…", "suena a que…") y sigue con una pregunta de "qué" o "cómo". Nunca uses "¿por qué?". Mantén la doble alternativa de fechas cuando ya esté.

Reescribe la respuesta de estas objeciones, manteniendo cada id:
${objs}

Texto actual de referencia:
WhatsApp: ${k.whatsapp}
Speech: ${k.speech.auditoria || ''} ${k.speech.apertura} ${k.speech.prueba} ${k.speech.plan || ''} ${k.speech.mercado} ${k.speech.pedido} ${k.speech.cierre}
Correo: ${k.email}

Responde solo con JSON con esta forma exacta:
{"whatsapp": "texto", "speech": {"auditoria": "texto", "apertura": "texto", "prueba": "texto", "plan": "texto", "mercado": "texto", "pedido": "texto", "cierre": "texto"}, "objeciones": [{"id": "presupuesto", "responder": "texto"}], "correo": "texto con saltos de línea"}`;
}

function applyPolish(d) {
  if (!d || typeof d !== 'object' || !d.speech || typeof d.speech !== 'object') return false;
  const k = S.kit;
  const str = v => typeof v === 'string' && v.trim().length > 0 && v.length < 2000;
  let changed = 0;
  if (str(d.whatsapp)) { k.whatsapp = d.whatsapp.trim(); changed++; }
  ['auditoria', 'apertura', 'prueba', 'plan', 'mercado', 'pedido', 'cierre'].forEach(key => { if (str(d.speech[key])) { k.speech[key] = d.speech[key].trim(); changed++; } });
  if (Array.isArray(d.objeciones)) {
    d.objeciones.forEach(o => {
      if (!o || !str(o.responder)) return;
      const t = k.objections.find(x => x.id === o.id);
      if (t) { t.reply = o.responder.trim(); changed++; }
    });
  }
  if (str(d.correo)) { k.email = d.correo.trim(); changed++; }
  return changed >= 3;
}

async function polishKit() {
  if (!RT.sample || RT.busy || !S.kit) return;
  const st = $('#ai-status');
  RT.busy = true;
  RT.ctl = new AbortController();
  syncCapabilityUI();
  const stop = $('#stop-ai'); if (stop) stop.hidden = false;
  if (st) st.textContent = 'Personalizando tu kit. Puede tardar hasta un minuto.';
  try {
    const data = await RT.sample.json(polishPrompt(), { signal: RT.ctl.signal, modelTier: 'default', cache: false });
    if (applyPolish(data)) {
      S.polished = true;
      RT.busy = false; RT.ctl = null;
      render();
      return;
    }
    if (st) st.textContent = 'La respuesta no tuvo el formato esperado. Tu kit sigue igual; intenta de nuevo.';
  } catch (e) {
    if (st) st.textContent = aiErrorCopy(e);
    if (aiPermanentFailure(e)) RT.sample = null;
  } finally {
    if (RT.busy) { RT.busy = false; RT.ctl = null; }
    const s2 = $('#stop-ai'); if (s2) s2.hidden = true;
    syncCapabilityUI();
  }
}

    { line: 'Te entiendo, pero la respuesta sigue siendo no.', model: k => `Lo entiendo. Entonces ayúdame a ver qué tendría que pasar para llegar ahí: ¿qué metas tendría que cumplir y en qué plazo? Si las cumplo, ¿lo revisamos en ${k.reviewMonth}?` },
    { line: 'Todavía no estás en ese nivel.', obj: 'nivel' },
    { line: '¿Algo más?', model: k => `Sí: ¿podemos dejar por escrito las metas y la fecha de revisión que acabamos de hablar? Hoy mismo ${k.trato === 'usted' ? 'le' : 'te'} envío un correo con el resumen.` }
  ]
};
const RE_DATE = /(lunes|martes|mi[eé]rcoles|jueves|viernes|semana|mes|enero|febrero|marzo|abril|mayo|junio|julio|agosto|se[pt]tiembre|octubre|noviembre|diciembre|fecha|cu[aá]ndo|revis|pr[oó]xim)/i;
const RE_BAD = /(deuda|pr[eé]stamo|mis gastos|necesito la plata|compa[nñ]er|gana m[aá]s que yo|me voy|renuncio|perd[oó]n|disculp)/i;
const RE_VALUE = /(logr|result|reduj|aument|ahorr|proyecto|cliente|equipo|responsab|%|lider|supervis|cerr|implement|automatic|venta|meta)/i;
const RE_ASK = /(propon|ajuste|aumento|revis|sueldo|remuneraci|s\/|\d)/i;
const RE_LABEL = /(parece que|suena a que|da la impresi[oó]n|pareciera que|me imagino que|entiendo que)/i;
const RE_CALIB = /¿\s*(c[oó]mo|qu[eé]|cu[aá]ndo|cu[aá]l)\b/i;
const RE_WHY = /¿\s*por\s*qu[eé]/i;
const RE_HEDGE = /\b(creo|siento|pienso|s[oó]lo|un poquito|ser[ií]a justo|podr[ií]a ser)\b/i;
const RE_AUDIT = /(quiz[aá]|seguramente|antes de empezar|s[eé] que|pienses|piense|puede parecer)/i;

function checksFor(text, opening) {
  const t = String(text || '');
  const list = opening
    ? [
        { ok: RE_VALUE.test(t), good: 'Abriste con tu aporte', bad: 'Abre con lo que aportas, no con lo que necesitas' },
        { ok: /\d/.test(t), good: 'Usaste una cifra o un dato', bad: 'Falta una cifra: tu propuesta o un resultado con número' },
        { ok: RE_ASK.test(t), good: 'Hiciste un pedido claro', bad: 'Haz el pedido de forma explícita' },
        { ok: !RE_BAD.test(t), good: 'Evitaste deudas, comparaciones y amenazas', bad: 'Evita deudas, comparaciones con compañeros, amenazas o disculpas' },
        { ok: !RE_HEDGE.test(t), good: 'Hablaste con seguridad', bad: 'Quita "creo", "siento", "solo" o "sería justo": afirma con "propongo" y "mis resultados muestran"' },
        { ok: RE_AUDIT.test(t), good: 'Te adelantaste a sus dudas', bad: 'Prueba adelantarte a sus dudas: "quizá pienses que no es el mejor momento…"' }
      ]
    : [
        { ok: t.trim().length > 30 && !/^(ok|ya|bueno|entiendo|est[aá] bien|de acuerdo|claro)[\s.,!]*$/i.test(t.trim()), good: 'No cediste de inmediato', bad: 'No cedas a la primera: responde con un argumento' },
        { ok: RE_LABEL.test(t) || RE_CALIB.test(t), good: 'Etiquetaste o preguntaste "qué" o "cómo"', bad: 'Prueba etiquetar ("parece que…") o preguntar "¿cómo podríamos…?"' },
        { ok: RE_DATE.test(t), good: 'Llevaste la conversación a una fecha o un siguiente paso', bad: 'Cierra con una fecha o un siguiente paso concreto' },
        { ok: !RE_BAD.test(t) && !RE_WHY.test(t), good: 'Evitaste deudas, comparaciones, amenazas y el "¿por qué?"', bad: 'Evita deudas, comparaciones, amenazas, disculpas y el "¿por qué?"' }
      ];
  return list;
}

function bossRules() {
  const a = S.answers, k = S.kit, kin = S.kitIn || {};
  const style = (byId(BOSS_STYLES, S.sim.style) || BOSS_STYLES[1]).desc;
  const ask = k.raise ? `va a pedir un ajuste a ${Kit.money(k.numbers.anchor)} mensuales (hoy gana ${Kit.money(Number(a.sueldo))})` : 'va a pedir crecer: un proyecto, capacitación y una revisión de su sueldo en seis meses';
  return `Vas a interpretar al jefe en un ensayo de negociación salarial en una empresa peruana. Estilo del jefe: ${style}.
Perfil del colaborador:
${profileLines()}
El colaborador ${ask}.
Reglas: responde solo como el jefe, en español peruano natural y cotidiano, en 1 a 3 oraciones y tratando al colaborador de tú. Si tu estilo es duro, di que no al menos tres veces antes de considerar algo. Si el colaborador nombra tus preocupaciones ("parece que…") o te pregunta "¿cómo…?" o "¿qué…?", te ablandas un poco y das información; si te presiona o te pregunta "¿por qué?", te pones a la defensiva. Pon objeciones realistas de una en una, según tu estilo: presupuesto, esperar la evaluación, banda salarial, un bono en vez de aumento, que lo decide gerencia. No aceptes de inmediato: cede poco a poco solo si el colaborador argumenta con resultados, sostiene una cifra concreta y propone una fecha. Nunca salgas del personaje, nunca des consejos y no uses comillas.${kin.aprueba && kin.aprueba !== 'jefe' ? ' Recuerda que la aprobación final la tiene ' + ((byId(APPROVERS, kin.aprueba) || {}).label || '').toLowerCase() + '.' : ''}`;
}

function simTurnsForAI() {
  const turns = [];
  let first = true;
  S.sim.turns.forEach(t => {
    if (t.role === 'me') {
      turns.push({ role: 'user', content: first ? `${bossRules()}\n\nEl colaborador abre la reunión y dice:\n${t.text}` : t.text });
      first = false;
    } else if (t.role === 'boss') {
      turns.push({ role: 'assistant', content: t.text });
    }
  });
  return turns;
}

function simHTML() {
  const sim = S.sim;
  const intro = `<h2>Practica antes de la reunión</h2>`;
  if (!sim) {
    const cur = (S.kitIn && S.kitIn.estilo) || 'cercano';
    return `${intro}
      <p>Tu jefe responde según su estilo. Tú abres la reunión, haces tu pedido y manejas sus objeciones.</p>
      <div class="field"><span>Estilo de tu jefe</span><div class="chips">${BOSS_STYLES.map(o => `<button type="button" class="chip${cur === o.id ? ' is-on' : ''}" data-action="sim-style" data-value="${o.id}" aria-pressed="${cur === o.id}">${esc(o.label)}</button>`).join('')}</div></div>
      <button type="button" class="btn" data-action="sim-start" data-mode="ia" data-needs="sample" hidden>Empezar la práctica con IA</button>
      <button type="button" class="btn-ghost" data-action="sim-start" data-mode="guiada">Empezar la práctica guiada</button>
      <p class="fine" data-needs="sample" hidden>Con IA, tu jefe responde libremente. La práctica guiada usa objeciones fijas y te muestra una respuesta modelo después de cada turno.</p>`;
  }
  const label = sim.mode === 'ia' ? 'Práctica con IA' : 'Práctica guiada';
  const bubbles = sim.turns.map(t => {
    if (t.role === 'me') return `<div class="bubble me"><span class="who">Tú</span>${esc(t.text)}</div>`;
    if (t.role === 'boss') return `<div class="bubble boss"><span class="who">Tu jefe</span>${esc(t.text)}</div>`;
    const checks = (t.checks || []).map(c => `<p class="${c.ok ? 'ok' : 'no'}">${esc(c.ok ? c.good : c.bad)}</p>`).join('');
    const model = t.model ? `<p><span class="label">Una respuesta modelo:</span> ${esc(t.model)}</p>` : '';
    return `<div class="coach">${t.text ? `<p>${esc(t.text)}</p>` : ''}${checks}${model}</div>`;
  }).join('');
  const pending = sim.pending ? `<div class="bubble boss" id="sim-pending"><span class="who">Tu jefe</span>${esc(RT.simText || 'Escribiendo…')}</div>` : '';
  const myTurns = sim.turns.filter(t => t.role === 'me').length;
  let foot = '';
  if (sim.done) {
    foot = feedbackHTML(sim.feedback) + `<button type="button" class="btn-ghost" data-action="sim-reset">Practicar de nuevo</button>`;
  } else {
    foot = `<div class="composer">
        <label class="small-label" for="sim-input">${myTurns === 0 ? 'Abre la reunión y haz tu pedido, como lo dirías en voz alta' : 'Tu respuesta'}</label>
        <textarea id="sim-input" ${sim.pending ? 'disabled' : ''}></textarea>
        <button type="button" class="btn" data-action="sim-send" ${sim.pending ? 'disabled' : ''}>Responder</button>
        ${sim.mode === 'ia' && myTurns >= 2 ? `<button type="button" class="btn-ghost" data-action="sim-finish" ${sim.pending ? 'disabled' : ''}>Terminar y ver mi evaluación</button>` : ''}
        ${sim.pending ? '<button type="button" class="link" data-action="stop-ai">Detener</button>' : ''}
      </div>
      <p class="status" id="sim-status" role="status">${esc(sim.status || '')}</p>`;
  }
  return `${intro}<p class="fine">${label}. Estilo: ${esc((byId(BOSS_STYLES, sim.style) || {}).label || '')}.</p><div class="chat">${bubbles}${pending}</div>${foot}`;
}

function feedbackHTML(f) {
  if (!f) return '';
  return `<div class="say feedback">
      <p class="score">${esc(f.puntaje)}<span class="fine"> de 10</span></p>
      ${f.bien && f.bien.length ? `<p class="label">Lo que hiciste bien</p><ul class="plain">${f.bien.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
      ${f.mejorar && f.mejorar.length ? `<p class="label">Para la próxima</p><ul class="plain">${f.mejorar.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
      ${f.frase ? `<p><span class="label">Prueba decir:</span> ${esc(f.frase)}</p>` : ''}
    </div>`;
}

function refreshSim() {
  const box = $('#sim');
  if (!box) return;
  box.innerHTML = simHTML();
  syncCapabilityUI();
}

function simSetStyle(id) {
  if (!S.kitIn) S.kitIn = {};
  S.kitIn.estilo = id;
  save();
  refreshSim();
}

function simStart(mode) {
  const useAI = mode === 'ia' && !!RT.sample;
  const style = (S.kitIn && S.kitIn.estilo) || 'cercano';
  S.sim = { mode: useAI ? 'ia' : 'guiada', style, turns: [], bossIdx: 0, done: false, pending: false, feedback: null, status: '' };
  S.sim.turns.push({ role: 'coach', text: 'Empieza tú: abre la reunión con tu aporte y haz tu pedido.' });
  save();
  refreshSim();
  const inp = $('#sim-input'); if (inp) inp.focus();
}

async function simSend() {
  const sim = S.sim;
  const inp = $('#sim-input');
  if (!sim || sim.pending || !inp) return;
  const text = inp.value.trim().slice(0, 1200);
  if (!text) return;
  const opening = sim.turns.filter(t => t.role === 'me').length === 0;
  sim.turns.push({ role: 'me', text });
  if (sim.mode === 'guiada') {
    const script = SCRIPT[sim.style] || SCRIPT.cercano;
    const checks = checksFor(text, opening);
    let model = null;
    if (!opening) {
      const prev = script[sim.bossIdx - 1];
      const o = prev && prev.obj ? S.kit.objections.find(x => x.id === prev.obj) : null;
      model = o ? o.reply : (prev && prev.model ? prev.model(S.kit) : null);
    }
    sim.turns.push({ role: 'coach', text: '', checks, model });
    sim.allChecks = (sim.allChecks || []).concat(checks);
    if (sim.bossIdx < script.length) {
      sim.turns.push({ role: 'boss', text: script[sim.bossIdx].line });
      sim.bossIdx++;
    } else {
      sim.done = true;
      sim.feedback = guidedFeedback(sim.allChecks);
    }
    save();
    refreshSim();
    const ni = $('#sim-input'); if (ni) ni.focus();
    return;
  }
  // Modo IA
  sim.pending = true; sim.status = '';
  RT.simText = '';
  RT.ctl = new AbortController();
  save(); refreshSim();
  try {
    const res = await RT.sample(simTurnsForAI(), {
      cache: false, modelTier: 'quick', signal: RT.ctl.signal,
      onText: ({ text: t }) => { RT.simText = t; const p = $('#sim-pending'); if (p) p.innerHTML = '<span class="who">Tu jefe</span>' + esc(t); }
    });
    sim.turns.push({ role: 'boss', text: res.text.trim() });
  } catch (e) {
    if (e && e.text) sim.turns.push({ role: 'boss', text: e.text.trim() });
    sim.status = aiErrorCopy(e);
    if (aiPermanentFailure(e)) { RT.sample = null; sim.mode = 'guiada'; sim.status += ' Seguimos en práctica guiada.'; }
  } finally {
    sim.pending = false; RT.ctl = null; RT.simText = '';
    save(); refreshSim();
    const ni = $('#sim-input'); if (ni) ni.focus();
  }
}

function guidedFeedback(checks) {
  const total = checks.length || 1;
  const okCount = checks.filter(c => c.ok).length;
  const uniq = arr => Array.from(new Set(arr));
  return {
    puntaje: Math.round(okCount / total * 10),
    bien: uniq(checks.filter(c => c.ok).map(c => c.good)).slice(0, 3),
    mejorar: uniq(checks.filter(c => !c.ok).map(c => c.bad)).slice(0, 3),
    frase: S.kit.speech.cierre
  };
}

async function simFinish() {
  const sim = S.sim;
  if (!sim || sim.pending) return;
  if (sim.mode !== 'ia' || !RT.sample) { sim.done = true; sim.feedback = guidedFeedback(sim.allChecks || []); save(); refreshSim(); return; }
  sim.pending = true; sim.status = 'Preparando tu evaluación…';
  RT.ctl = new AbortController();
  save(); refreshSim();
  const transcript = sim.turns.filter(t => t.role !== 'coach').map(t => (t.role === 'me' ? 'Colaborador: ' : 'Jefe: ') + t.text).join('\n');
  const k = S.kit;
  const target = k.raise ? `una cifra concreta (${Kit.money(k.numbers.anchor)})` : 'un proyecto con metas y una revisión de sueldo en seis meses';
  const prompt = `Evalúa el desempeño del colaborador (no del jefe) en este ensayo de negociación salarial en Perú.
Criterios: se adelantó a las dudas del jefe al abrir; habló con seguridad, sin muletillas como "creo", "siento" o "solo"; abrió con su aporte; usó resultados con números; pidió ${target}; ante las objeciones usó etiquetas ("parece que…") y preguntas de "qué" o "cómo" en vez de "¿por qué?"; no partió la diferencia ni cedió de inmediato; cerró con una fecha o un siguiente paso; evitó hablar de deudas, compararse con compañeros, amenazar o disculparse.
Transcripción:
${transcript}

Responde solo con JSON con esta forma: {"puntaje": 0, "bien": ["frase corta"], "mejorar": ["frase corta"], "frase": "una frase que el colaborador podría usar la próxima vez"}. "puntaje" es un entero de 0 a 10; máximo 3 elementos por lista; habla al colaborador de tú.`;
  try {
    const f = await RT.sample.json(prompt, { cache: false, modelTier: 'default', signal: RT.ctl.signal });
    const okArr = v => Array.isArray(v) ? v.filter(x => typeof x === 'string').slice(0, 3) : [];
    sim.feedback = { puntaje: Math.max(0, Math.min(10, Math.round(Number(f && f.puntaje) || 0))), bien: okArr(f && f.bien), mejorar: okArr(f && f.mejorar), frase: f && typeof f.frase === 'string' ? f.frase : '' };
    sim.done = true; sim.status = '';
  } catch (e) {
    sim.status = aiErrorCopy(e);
    if (aiPermanentFailure(e)) RT.sample = null;
  } finally {
    sim.pending = false; RT.ctl = null;
    save(); refreshSim();
  }
}

/* ---------- Arranque ---------- */
load();
if (S.sim && S.sim.pending) S.sim.pending = false;
render();
initRuntime();
</script>
</body>
</html>
